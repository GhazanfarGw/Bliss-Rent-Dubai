<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Real brand favicon (generated from the supplied logo mark — see
         src/assets/brand/logo-mark.png and the NavBar/Footer/admin brand
         usage it's also used for). favicon.svg is the old generic
         placeholder and is no longer referenced. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b132b" />
    <title>Car Rental Dubai from AED 72/day | DXB Airport Pickup — Bliss Rent</title>
    <meta
      name="description"
      content="Rent a car in Dubai from AED 72/day. Pickup at DXB Terminal 1 &amp; 3 or hotel delivery. Economy, SUVs, luxury cars and supercars — daily, weekly and monthly. Book online or on WhatsApp."
    />
    <!-- Static baseline for the "/" route. Every other route overrides
         this at runtime via useMetaDescription (src/lib/useDocumentTitle.ts),
         which is also where SITE_URL lives — update it there, here, and
         in scripts/generate-sitemap.mjs together if the domain changes. -->
    <link rel="canonical" href="https://bliss.rent/" />

    <!-- Open Graph / Twitter card. og-image.jpg (1200x630) is the shared social preview. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bliss Rent" />
    <meta property="og:title" content="Car Rental Dubai from AED 72/day | DXB Airport Pickup — Bliss Rent" />
    <meta
      property="og:description"
      content="Rent a car in Dubai from AED 72/day. Pickup at DXB Terminal 1 &amp; 3 or hotel delivery. Economy, SUVs, luxury cars and supercars — daily, weekly and monthly. Book online or on WhatsApp."
    />
    <meta property="og:url" content="https://bliss.rent/" />
    <meta property="og:image" content="https://bliss.rent/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bliss Rent — car rental in Dubai from AED 72/day" />
    <meta property="og:locale" content="en_AE" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bliss.rent/og-image.jpg" />
    <meta name="twitter:title" content="Car Rental Dubai from AED 72/day | DXB Airport Pickup — Bliss Rent" />
    <meta
      name="twitter:description"
      content="Rent a car in Dubai from AED 72/day. Pickup at DXB Terminal 1 &amp; 3 or hotel delivery. Economy, SUVs, luxury cars and supercars — daily, weekly and monthly. Book online or on WhatsApp."
    />

    <!-- Cairo covers both Latin and Arabic script cleanly in one family,
         matching the bilingual EN/AR UI (see src/i18n/). Playfair Display
         is Latin-only, used for the sitewide serif heading treatment (see
         --font-hero-serif in index.css, applied to the homepage hero and
         every major section/page heading) — Arabic glyphs fall through
         to Cairo automatically since it's second in that font-family
         stack. Weights: 500/600 cover the hero's own font-medium/italic
         accent; 700/900 cover the font-bold/font-black weight most other
         headings sitewide already use. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,900;1,500;1,600&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data: contact details match src/features/booking/contactLinks.ts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoRental",
        "@id": "https://bliss.rent/#business",
        "name": "Bliss Rent",
        "alternateName": "Bliss Car Rental",
        "url": "https://bliss.rent/",
        "logo": "https://bliss.rent/icon-512.png",
        "image": "https://bliss.rent/og-image.jpg",
        "description": "Car rental in Dubai from AED 72/day with pickup at Dubai International Airport (DXB) Terminal 1 and 3, Al Maktoum (DWC) and hotel delivery. Economy, SUV, luxury and supercar rentals — daily, weekly and monthly.",
        "telephone": "+971547820057",
        "email": "support@bliss.rent",
        "priceRange": "AED 72 - AED 7,550 per day",
        "currenciesAccepted": "AED",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Apt 121B, Block B, Sajaya 7 Building, Manama Street, Nad Al Sheba 3",
          "addressLocality": "Dubai",
          "addressCountry": "AE"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": 25.163296, "longitude": 55.382061 },
        "areaServed": [
          { "@type": "City", "name": "Dubai" },
          { "@type": "City", "name": "Sharjah" },
          { "@type": "City", "name": "Abu Dhabi" },
          { "@type": "Airport", "name": "Dubai International Airport", "iataCode": "DXB" },
          { "@type": "Airport", "name": "Al Maktoum International Airport", "iataCode": "DWC" }
        ],
        "sameAs": [
          "https://www.facebook.com/blisscarrental",
          "https://www.instagram.com/blisscarrentalofficial"
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
